name: Test skill

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation-only dependency
        run: python -m pip install "PyYAML>=6,<7"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run official quick-validator snapshot
        run: python .github/scripts/official_quick_validate.py outputs/ycet-design-system-governor
      - name: Validate complete package
        run: python outputs/ycet-design-system-governor/scripts/validate_package.py --skill-root outputs/ycet-design-system-governor --expected-system-count 151
